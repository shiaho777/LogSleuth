name: Bug report
description: Report a problem with LogSleuth
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LogSleuth or SDK version
      description: The viewer version is in Settings → About.
      placeholder: e.g. 0.4.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 7, Android 14
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Log access method
      options:
        - Shizuku
        - Root
        - ADB READ_LOGS grant
        - Remote ADB
        - SDK mode (embedded in my app)
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Attach the relevant stack trace or log excerpt after removing tokens, account details, and other private information.
      render: text
