# Builds the VitePress documentation site under docs/ and deploys it to
# GitHub Pages. On pull requests the site is only built (to catch breakage);
# on push to main and on manual dispatch it is built and deployed.
name: Docs Deploy

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
      - "scripts/stage_sdk_maven.py"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
      - "scripts/stage_sdk_maven.py"
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Stage published SDK versions
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archives=$(mktemp -d "$RUNNER_TEMP/logsleuth-sdk.XXXXXX")
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.draft == false) | .assets[]
            | select(.name | test("^logsleuth-sdk-[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9.-]+)?-maven[.]zip$"))
            | [(.id | tostring), .name] | @tsv')
          while IFS=$'	' read -r id name; do
            [[ -n "$id" ]] || continue
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$archives/$name"
          done <<< "$assets"
          shopt -s nullglob
          python3 scripts/stage_sdk_maven.py docs/.vitepress/dist/maven "$archives"/*.zip

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job touches Pages: the build job runs on pull_requests (including
    # same-repo branches) and executes third-party dependency postinstall code, so it
    # must not hold Pages/OIDC write capabilities.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
