# Preconditions: versionName in app/build.gradle.kts equals the tag (minus the
# leading "v"), versionCode was bumped, and docs/releases/<tag>.md holds the
# bilingual release notes. The guards below fail the run otherwise, so a tag
# can never ship a stale version number or an unreviewed changelog.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install needed SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same gate as CI: a release must not skip the bilingual string check.
      - name: String parity gate (values vs values-zh-rCN)
        run: python3 scripts/check_string_parity.py

      # A tag that disagrees with the build file would publish an APK whose
      # version name is older than the Release it hangs under.
      - name: Check tag matches versionName
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$version" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version}"
            exit 1
          fi
          echo "Releasing ${version} (versionCode ${code})"

      # The notes are a committed file, reviewed in the version-bump PR, so
      # the Release page shows the same bilingual text the repository holds.
      # A missing file is a hard failure: machine-generated commit subjects
      # would ship an English-only changelog nobody reviewed.
      - name: Check the release notes exist
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing ${notes}. Write it with scripts/draft_release_notes.py and commit it in the version-bump PR."
            exit 1
          fi
          echo "Release notes: ${notes}"

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Stage and consume the SDK Maven artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./gradlew :sdk:publishReleasePublicationToStagingRepository -Plogsleuth.sdkVersion="$version" --no-daemon
          ./gradlew :sample:assembleDebug -Plogsleuth.sdkVersion="$version" --no-daemon
          (cd sdk/build/maven-repository && zip -qr "$GITHUB_WORKSPACE/logsleuth-sdk-$version-maven.zip" io)

      - name: Assemble and verify signed release
        env:
          LOGSLEUTH_KEYSTORE_BASE64: ${{ secrets.LOGSLEUTH_RELEASE_KEYSTORE_BASE64 }}
          LOGSLEUTH_SIGNING_STORE_PASSWORD: ${{ secrets.LOGSLEUTH_RELEASE_STORE_PASSWORD }}
          LOGSLEUTH_SIGNING_KEY_ALIAS: ${{ secrets.LOGSLEUTH_RELEASE_KEY_ALIAS }}
          LOGSLEUTH_SIGNING_KEY_PASSWORD: ${{ secrets.LOGSLEUTH_RELEASE_KEY_PASSWORD }}
          LOGSLEUTH_EXPECTED_CERT: ${{ vars.LOGSLEUTH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${LOGSLEUTH_KEYSTORE_BASE64:?Missing release keystore}"
          expected=$(printf '%s' "$LOGSLEUTH_EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Set the expected release certificate SHA-256"; exit 1; }
          umask 077
          LOGSLEUTH_SIGNING_STORE_FILE=$(mktemp "$RUNNER_TEMP/logsleuth-signing.XXXXXX")
          export LOGSLEUTH_SIGNING_STORE_FILE
          trap 'unlink "$LOGSLEUTH_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$LOGSLEUTH_KEYSTORE_BASE64" | base64 --decode > "$LOGSLEUTH_SIGNING_STORE_FILE"
          unset LOGSLEUTH_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease --no-daemon
          src="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          signature=$("$apksigner" verify --print-certs "$src")
          actual=$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest: / { print tolower($2) }' <<< "$signature")
          [[ "$actual" == "$expected" ]] || { echo "::error::APK signer does not match the configured certificate"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          cp "$src" "LogSleuth-$version.APK"
          sha256sum "LogSleuth-$version.APK" "logsleuth-sdk-$version-maven.zip" > "LogSleuth-$version-SHA256SUMS.txt"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          assets=("LogSleuth-$version.APK" "logsleuth-sdk-$version-maven.zip" "LogSleuth-$version-SHA256SUMS.txt")
          notes="docs/releases/$tag.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ $(gh release view "$tag" --json isDraft --jq '.isDraft') == false ]]; then
              published=$(gh release view "$tag" --json assets --jq '.assets[].name')
              for asset in "${assets[@]}"; do
                grep -Fxq "$asset" <<< "$published" || { echo "::error::Published release is missing $asset"; exit 1; }
              done
              exit 0
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file "$notes" --title "LogSleuth $version" --draft=false
          else
            gh release create "$tag" "${assets[@]}" --draft --verify-tag \
              --title "LogSleuth $version" --notes-file "$notes"
            gh release edit "$tag" --draft=false
          fi

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LogSleuth-release-${{ github.ref_name }}
          path: |
            LogSleuth-*.APK
            LogSleuth-*-SHA256SUMS.txt
            logsleuth-sdk-*-maven.zip
          if-no-files-found: error
          retention-days: 14
