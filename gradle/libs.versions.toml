[versions]
agp = "8.9.3"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
coreKtx = "1.15.0"
appcompat = "1.7.0"
lifecycle = "2.9.4"
activityCompose = "1.12.4"
